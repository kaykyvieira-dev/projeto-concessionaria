<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Concessionária</title>
</head>
<body>

    <div class="painel-montagem">
        <h2>Linha de Montagem de Veículos</h2>
        
        <input type="text" id="marca" onkeyup="atualizarPreview()" placeholder="Digite a marca...">
        <input type="text" id="modelo" placeholder="Digite o modelo...">
        <input type="number" id="ano" placeholder="Digite o ano...">
        
        <button onclick="fabricarCarro()">Fabricar Carro</button>

        <p id="preview">Digitando: <span id="previewTexto">...</span></p>
    </div>
    
    <h3>Pátio de Veículos</h3>

    <div id="patio">
        </div>
    
    <script src="script.js"></script>
</body>
</html>
